name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 类型检查 / 构建 / 核心断言
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建前端
        run: pnpm build

      # test-core（序列化 / 文件名）、test-math（公式脚注往返）、test-conflict（外部改动比对）
      - name: 核心逻辑断言
        run: pnpm test

  rust:
    name: Rust 单元测试（vault / 备份）
    # 和发布用同一个系统：Windows 自带 WebView2，不必另装一堆 Linux 图形库
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # vault 的章节识别、按章写回，以及备份/恢复（含路径穿越、坏压缩包）都是会动用户数据的操作
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

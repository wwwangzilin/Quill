name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 类型检查 / 构建 / 核心断言
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建前端
        run: pnpm build

      - name: 核心逻辑断言（Markdown 序列化 / 文件名安全化）
        run: node test-core.mjs && node test-math.mjs

  rust:
    name: Rust 单元测试（vault）
    # 和发布用同一个系统：Windows 自带 WebView2，不必另装一堆 Linux 图形库
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # vault 里有章节识别、按章写回等破坏性操作的单元测试，之前没人跑
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

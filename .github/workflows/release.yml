name: Release

# 推一个 v* 的 tag 就自动出安装包并发布 Release：
#   git tag v0.2.0 && git push origin v0.2.0
# 版本号以 tag 为唯一真相源，构建前会同步进 package.json / tauri.conf.json / Cargo.toml。
# 也可以在 Actions 页面手动触发（填个 tag 名，用于补发或重发）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.2.0）。tag 不存在时会基于当前分支创建'
        required: true

permissions:
  contents: write

# 同一个 tag 连着触发时排队，别抢着写同一个 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成「本次更新」要用 git log 比较上一个 tag，浅克隆拿不到历史
          fetch-depth: 0

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          $raw = "${{ inputs.tag }}"
          if (-not $raw) { $raw = "${{ github.ref_name }}" }
          $ver = $raw.TrimStart('v', 'V')
          if ($ver -notmatch '^\d+\.\d+\.\d+') {
            Write-Error "从 '$raw' 里解析不出合法版本号"
            exit 1
          }
          # 带 -beta.1 / -rc.2 这种后缀的算预发布
          $pre = if ($ver.Contains('-')) { 'true' } else { 'false' }
          "tag=$raw"      >> $env:GITHUB_OUTPUT
          "version=$ver"  >> $env:GITHUB_OUTPUT
          "prerelease=$pre" >> $env:GITHUB_OUTPUT
          Write-Host "版本 $ver ｜ 预发布 $pre"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 同步版本号（tag -> 三个清单文件）
        run: node scripts/set-version.mjs ${{ steps.ver.outputs.version }}

      # 发布前的门禁：类型不过、核心断言不过，就不许出包
      - name: 类型检查
        run: pnpm typecheck

      - name: 核心逻辑断言
        run: node test-core.mjs

      - name: 构建桌面应用（含 NSIS 安装包 + 签名更新包）
        # 自动更新的包必须签名：公钥在 tauri.conf.json 里，私钥只存在 Secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: 收集产物
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # 产物统一改成英文名：GitHub 会静默吞掉附件名里的非 ASCII 字符
          Copy-Item src-tauri/target/release/quill.exe "out/Quill_${ver}_portable.exe"
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $setup) { Write-Error 'NSIS 安装包没生成'; exit 1 }
          Copy-Item $setup.FullName "out/Quill_${ver}_x64-setup.exe"

          # 自动更新用的是 NSIS 的 zip 包 + 它的 minisign 签名
          $zip = Get-ChildItem src-tauri/target/release/bundle/nsis/*.nsis.zip | Select-Object -First 1
          if (-not $zip) { Write-Error '没找到 .nsis.zip —— 检查 tauri.conf.json 里 updater.active 是不是 true'; exit 1 }
          Copy-Item $zip.FullName "out/Quill_${ver}_x64-setup.nsis.zip"
          $sig = "$($zip.FullName).sig"
          if (-not (Test-Path $sig)) {
            Write-Error '更新包没有签名 —— 检查 TAURI_SIGNING_PRIVATE_KEY 这个 Secret 配了没'
            exit 1
          }
          Copy-Item $sig "out/Quill_${ver}_x64-setup.nsis.zip.sig"
          Get-ChildItem out | Select-Object Name, Length

      - name: 生成更新说明
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $ver = "${{ steps.ver.outputs.version }}"
          $prev = ''
          # 上一个 tag（没有就是首次发布）
          git fetch --tags --force 2>$null
          try { $prev = (git describe --tags --abbrev=0 "$tag^" 2>$null) } catch { $prev = '' }
          if ($prev) {
            Write-Host "比较区间：$prev..$tag"
            $log = git log --no-merges --pretty=format:"- %s" "$prev..HEAD"
          } else {
            Write-Host '没有上一个 tag，取最近 20 条提交'
            $log = git log --no-merges --pretty=format:"- %s" -20
          }
          if (-not $log) { $log = '- 细节见提交记录' }

          $notes = @(
            "Quill $tag —— 本地优先的写作工具：沉浸写作 + 大纲 + 思维导图，文档就是纯 Markdown。",
            "",
            "### 下载哪个",
            "- ``Quill_${ver}_x64-setup.exe``：安装包（推荐），装完有开始菜单项",
            "- ``Quill_${ver}_portable.exe``：免安装，双击直接跑",
            "",
            "### 文档存在哪",
            "默认在 ``%USERPROFILE%\Documents\Quill``，每篇是一个 `.md` 文件，每次保存自动产生一次 git 提交 —— 换机器、硬盘坏了都能拿回来，任何 git 客户端都能读。",
            "",
            "### 本次更新",
            $log
          )
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          Get-Content release-notes.md | Select-Object -First 6

      - name: 生成更新清单 latest.json
        shell: pwsh
        run: |
          $ver  = "${{ steps.ver.outputs.version }}"
          $tag  = "${{ steps.ver.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $sig  = (Get-Content "out/Quill_${ver}_x64-setup.nsis.zip.sig" -Raw).Trim()
          $notes = Get-Content release-notes.md -Raw
          $manifest = [ordered]@{
            version  = $ver
            notes    = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $sig
                url = "https://github.com/$repo/releases/download/$tag/Quill_${ver}_x64-setup.nsis.zip"
              }
            }
          }
          # 客户端就认这个文件：/releases/latest/download/latest.json
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path latest.json -Encoding utf8
          Write-Host "latest.json 的 version = $ver"
          Get-Content latest.json | Select-Object -First 6

      - name: 上传构建产物（Actions 页可直接下载）
        uses: actions/upload-artifact@v4
        with:
          name: quill-windows-${{ steps.ver.outputs.version }}
          path: |
            out/*.exe
            out/*.nsis.zip
            latest.json
          if-no-files-found: error

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Quill ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          body_path: release-notes.md
          files: |
            out/*.exe
            out/*.nsis.zip
            latest.json

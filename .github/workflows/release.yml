name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建桌面应用（含 NSIS 安装包）
        run: pnpm tauri build

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item src-tauri/target/release/quill.exe out/Quill_绿色版.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Get-ChildItem out | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: quill-windows
          path: out/*.exe
          if-no-files-found: error

      - name: 发布 Release（预发布）
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: out/*.exe
          body: |
            Quill 早期开发版（pre-release）。

            下载后在 Windows 上直接运行；`Quill_0.1.0_x64-setup.exe` 是安装包，`Quill_绿色版.exe` 免安装。

            文档默认存放在 `%USERPROFILE%\Documents\Quill`，是纯 Markdown 文件加一个 git 仓库。

<!-- Quill 应用图标的源设计：金色渐变底 + 深墨羽毛（笔尖朝下）
     改完重新生成全套图标：
       node .verify/render-new-icon.mjs && pnpm tauri icon .verify/icon-new.png
     窗口标题栏那个小标记用的是 src/ui/BrandMark.tsx（同一造型，不带金底）。
     羽枝刻意少而粗：16px 的任务栏/托盘里，细羽枝会糊成一团黑。
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d8ab" />
      <stop offset="46%" stop-color="#cba56b" />
      <stop offset="100%" stop-color="#9c7735" />
    </linearGradient>
    <linearGradient id="ink" x1="0.2" y1="0.05" x2="0.8" y2="0.95">
      <stop offset="0%" stop-color="#3a3226" />
      <stop offset="55%" stop-color="#221d16" />
      <stop offset="100%" stop-color="#12100c" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#gold)" />
  <g transform="rotate(-30 512 512)">
    <path d="M 512 150 L 565.8 124.0 L 558.3 223.0 L 666.5 246.7 L 644.8 345.7 L 712.6 369.3 L 684.5 468.4 L 723.5 492.0 L 693.9 591.0 L 700.3 614.7 L 673.9 713.7 L 639.5 737.3 L 621.7 836.4 L 565.8 860.0 L 512 886 L 458.2 860.0 L 402.3 836.4 L 384.5 737.3 L 350.1 713.7 L 323.7 614.7 L 330.1 591.0 L 300.5 492.0 L 339.5 468.4 L 311.4 369.3 L 379.2 345.7 L 357.5 246.7 L 465.7 223.0 L 458.2 124.0 Z" fill="url(#ink)" />
    <path d="M 512 190 L 512 828" stroke="#e9c98f" stroke-width="13" stroke-linecap="round" />
  </g>
</svg>
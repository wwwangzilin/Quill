<!-- Quill 应用图标的源设计：金色渐变底 + 深墨 Q
     改完用这条命令重新生成全套图标：
       node render-icons.mjs && pnpm tauri icon .verify/icon-a.png
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6c78f" />
      <stop offset="50%" stop-color="#cba56b" />
      <stop offset="100%" stop-color="#a8843f" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#gold)" />
  <text
    x="512"
    y="742"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', 'Songti SC', serif"
    font-size="660"
    font-weight="700"
    fill="#17150f"
  >
    Q
  </text>
</svg>
